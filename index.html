  const open = (k) => { chat.view = 'conv'; chat.thread = k; chat.unread[k] = 0; delete chat.unread[k]; chatSave(); chatRender(); };
  const last = (k) => { const l = chat.log.filter((m) => m.t === k).pop(); return l ? (l.me ? 'Você: ' : k === 'all' ? l.name + ': ' : '') + l.text : ''; };
  const row = (k, dot, name, sub, strong) => h('button', { type: 'button', class: 'chrow', onclick: () => open(k) }, dot, h('span', { class: 'cinfo' }, h('b', null, name), h('small', null, sub)), chat.unread[k] > 0 && h('span', { class: 'cbadge' }, chat.unread[k]));
  fill($('#chatBody'),
    h('div', { class: 'chead' }, h('b', null, 'Chat da equipe'), h('small', null, chat.ok ? (peers.length + 1) + ' online' : 'conectando…'), h('button', { type: 'button', class: 'icon-btn sm', 'aria-label': 'Minimizar chat', onclick: () => { chat.open = false; chatRender(); } }, ico('x'))),
    h('button', { type: 'button', class: 'cme', onclick: () => { chat.edit = true; chatRender(); }, title: 'Editar meu status' }, chatDot(me.mode), h('span', { class: 'cinfo' }, h('b', null, me.name + ' (você)'), h('small', null, chatStatusLine(me))), h('span', { class: 'cedit' }, 'Editar')),
    h('div', { class: 'clist' },
      row('all', h('i', { class: 'cdot', style: '--dc:var(--accent)' }), 'Equipe (todos)', last('all') || 'Mensagem para todos que estão online'),
      h('span', { class: 'flabel' }, 'Online · ' + peers.length),
      peers.length === 0 && h('p', { class: 'empty' }, 'Ninguém mais online agora.'),
      rows.map((r) => row(r.id, chatDot(r.p ? r.p.mode : 'invisible', !!r.p), chatThreadName(r.id), r.p ? chatStatusLine(r.p) : 'Offline' + (last(r.id) ? ' · ' + last(r.id) : '')))));
}
function chatConv() {
  const k = chat.thread, peer = chat.peers[k], msgs = h('div', { class: 'cmsgs', 'aria-live': 'polite' });
  const paint = () => {
    const list = chat.log.filter((m) => m.t === k).slice(-120);
    fill(msgs, list.length ? list.map((m) => h('div', { class: 'cmsg' + (m.me ? ' me' : '') }, !m.me && k === 'all' && h('small', null, m.name), h('span', null, m.text), h('time', null, chatTime(m.ts)))) : h('p', { class: 'empty' }, 'Nenhuma mensagem ainda. Diga oi!'));
    msgs.scrollTop = msgs.scrollHeight;
  };
  const input = h('input', { class: 'field', maxlength: 500, placeholder: k !== 'all' && !peer ? 'Pessoa offline' : 'Escreva uma mensagem', 'aria-label': 'Mensagem', value: chat.draft, disabled: k !== 'all' && !peer ? 'disabled' : null, oninput: (e) => { chat.draft = e.target.value; } });
  paint();
  fill($('#chatBody'),
    h('div', { class: 'chead' }, h('button', { type: 'button', class: 'icon-btn sm', 'aria-label': 'Voltar', onclick: () => { chat.view = 'list'; chatRender(); } }, ico('chev-l')),
      k === 'all' ? h('i', { class: 'cdot', style: '--dc:var(--accent)' }) : chatDot(peer ? peer.mode : 'invisible', !!peer),
      h('span', { class: 'cinfo' }, h('b', null, chatThreadName(k)), h('small', null, k === 'all' ? (chatOnline().length + 1) + ' online' : peer ? chatStatusLine(peer) : 'Offline')),
      h('button', { type: 'button', class: 'icon-btn sm', 'aria-label': 'Minimizar chat', onclick: () => { chat.open = false; chatRender(); } }, ico('x'))),
    msgs,
    h('form', { class: 'cform2', onsubmit: (e) => { e.preventDefault(); if (chatSend(input.value)) { input.value = ''; chat.draft = ''; chatRender(); } } }, input, h('button', { type: 'submit', class: 'btn primary', disabled: k !== 'all' && !peer ? 'disabled' : null }, 'Enviar')));
  if (!input.disabled) input.focus();
}
function chatRender() {
  const tab = $('#chatTab'), pan = $('#chatPanel');
  if (!tab) return;
  tab.hidden = !chat.on;
  if (!chat.on) { pan.hidden = true; return; }
  const n = chatTotalUnread(), on = chatOnline().length;
  fill(tab, ico('chat'), h('b', null, 'Chat'), n > 0 ? h('span', { class: 'cbadge' }, n) : h('i', { class: 'cdot live', style: '--dc:' + (chat.ok && chat.mode !== 'invisible' ? chatMode(chat.mode)[2] : 'var(--faint)') }), on > 0 && n === 0 && h('small', null, on));
  tab.setAttribute('aria-expanded', chat.open ? 'true' : 'false');
  pan.hidden = !chat.open;
  if (!chat.open) return;
  // mantém o que está sendo digitado: numa conversa aberta, só atualiza as mensagens
  const live = pan.querySelector('.cmsgs');
  if (live && chat.view === 'conv' && !chat.edit && pan.dataset.thread === chat.thread) {
    const k = chat.thread, list = chat.log.filter((m) => m.t === k).slice(-120);
    fill(live, list.length ? list.map((m) => h('div', { class: 'cmsg' + (m.me ? ' me' : '') }, !m.me && k === 'all' && h('small', null, m.name), h('span', null, m.text), h('time', null, chatTime(m.ts)))) : h('p', { class: 'empty' }, 'Nenhuma mensagem ainda. Diga oi!'));
    live.scrollTop = live.scrollHeight;
    if (chat.unread[k]) { delete chat.unread[k]; chatSave(); }
    return;
  }
  pan.dataset.thread = chat.view === 'conv' ? chat.thread : '';
  if (chat.edit) chatStatusForm(); else if (chat.view === 'conv') chatConv(); else chatList();
}
function chatStart(email, uidv) {
  chatLoad();
  chat.id = uidv || (() => { try { let v = sessionStorage.getItem('senso-chat-id'); if (!v) { v = uid(); sessionStorage.setItem('senso-chat-id', v); } return v; } catch (e) { return uid(); } })();
  if (!chat.name) { const t = teamOf(state.meId || ex.me); chat.name = t ? t.full : chatStr(String(email || '').split('@')[0], 40) || 'Visitante'; }
  chat.on = true; chatConnect(); chatRender();
}
function chatStop() { chatDisconnect(); chat.on = false; chat.open = false; chatRender(); }
function wireChat() {
  $('#chatTab').addEventListener('click', () => { chat.open = !chat.open; if (chat.open && chat.view === 'conv') { delete chat.unread[chat.thread]; chatSave(); } chatRender(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && chat.open && !$('#chatPanel').hidden && document.activeElement && document.activeElement.closest('#chatPanel')) { chat.open = false; chatRender(); $('#chatTab').focus(); } });
  window.addEventListener('pagehide', () => { if (chat.tr) { try { chat.tr.close(); } catch (e) { /* saindo */ } } });
}

/* ---------- Eventos fixos e arranque ---------- */
function wireUI() {
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  buildFilters();
  syncFilters();
  $('#fBtn').addEventListener('click', () => togglePop());
  document.addEventListener('pointerdown', (e) => { if (!$('#fPop').hidden && !e.target.closest('.fwrap')) togglePop(false); });
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  $('#calBtn').addEventListener('click', calToggle);
  $('#alertBtn').addEventListener('click', () => toggleAlert());
  document.addEventListener('pointerdown', (e) => { if (!$('#alertPop').hidden && !e.target.closest('.awrap')) toggleAlert(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#alertPop').hidden) toggleAlert(false); });
  $('#mLabEdit').addEventListener('click', () => openMg(labelsMg));
  $('#mgScrim').addEventListener('mousedown', (e) => { if (e.target === $('#mgScrim')) closeMg(); });
  window.addEventListener('hashchange', () => {
    const v = viewFromHash();
    if (v !== state.view) setView(v);
  });
  window.addEventListener('resize', () => calPlace());

  const bt = $('#boardTitle');
  bt.addEventListener('input', fitBoardTitle);
  bt.addEventListener('change', () => {
    const v = bt.value.trim() || 'SBase';
    bt.value = v;
    saveTitle(v);
  });
  bt.addEventListener('keydown', (e) => { if (e.key === 'Enter') bt.blur(); });

  $('#cardForm').addEventListener('submit', saveCard);
  $('#mTitle').addEventListener('input', fitTitle);
  $('#mTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#cardForm').requestSubmit(); } });
  $('#mClose').addEventListener('click', closeCard);
  $('#mDel').addEventListener('click', deleteCard);
  $('#scrim').addEventListener('mousedown', (e) => { if (e.target === $('#scrim')) closeCard(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (cd && cd.on) { calCancel(); return; }
      if (cdrag || cpress) { colCancel(); return; }
      if (state.drag) { onCancel(); return; }
      closeMenus();
      togglePop(false);
      if (!$('#mgScrim').hidden) { closeMg(); return; }
      if (!$('#setScrim').hidden) { closeSettings(); return; }
      if (!$('#scrim').hidden) { closeCard(); return; }
      if (state.cal.open && !state.cal.docked) calClose();
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if (e.key === 'n' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && $('#scrim').hidden && $('#setScrim').hidden && $('#auth').hidden && !$('#fab').hidden) {
      e.preventDefault();
      openCard();
    }
  });
  /* Botão voltar do Android: fecha o que estiver aberto, depois volta ao Início; no Início, sai do app. */
  window.onBack = function () {
    if (!$('#auth').hidden) return false;
    if (cd && cd.on) { calCancel(); return true; }
    if (cdrag || cpress) { colCancel(); return true; }
    if (state.drag) { onCancel(); return true; }
    if (document.querySelector('.menu')) { closeMenus(); return true; }
    if (!$('#mgScrim').hidden) { closeMg(); return true; }
    if (!$('#setScrim').hidden) { closeSettings(); return true; }
    if (!$('#scrim').hidden) { closeCard(); return true; }
    if (!$('#alertPop').hidden) { toggleAlert(false); return true; }
    if (!$('#fPop').hidden) { togglePop(false); return true; }
    if (state.cal.open && !state.cal.docked) { calClose(); return true; }
    if (state.view !== 'inicio') { setView('inicio'); return true; }
    return false;
  };
  wireSettings();
  wireFab();
}

const use = (name) => {
  try { return window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
};

function startLocal() {
  state.mode = 'local';
  const saved = lsLoad();
  if (saved && Array.isArray(saved.cols) && saved.cols.some((x) => x && typeof x === 'object' && x.id)) {
    state.cols = saved.cols.filter((x) => x && typeof x === 'object' && x.id).map(colNorm);
    state.cards = arrOf(saved.cards).filter((x) => x && typeof x === 'object' && x.id).map(cardNorm);
    state.title = typeof saved.title === 'string' && saved.title ? saved.title : state.title;
  } else {
    state.cols = defaultCols();
    state.cards = welcomeCards(state.cols);
    lsSave();
  }
  state.loaded = { cols: true, cards: true };
  $('#boardTitle').value = state.title;
  setNotice('Esta é uma cópia só sua: as alterações ficam neste navegador e a equipe não vê. Abra o quadro pelo link do artefato, com a sua conta, para trabalharem juntos.');
  render();
}

function startDb() {
  state.mode = 'db';
  const fresh = { cols: false, cards: false };
  const timer = setTimeout(() => {
    if (!(fresh.cols && fresh.cards)) setNotice('Ainda sem resposta do servidor. O quadro continua tentando e pode estar desatualizado.');
  }, 10000);
  const settle = () => { if (fresh.cols && fresh.cards) { clearTimeout(timer); setNotice(''); } };
  const onErr = (e) => {
    state.error = e && e.code === 'revoked' ? 'Seu acesso a este quadro mudou.' : 'Algo impediu o carregamento. Recarregue a página em instantes.';
    render();
  };
  state.db.collection('columns').onSnapshot((s) => {
    state.cols = s.docs.map((d) => colNorm({ id: d.id, ...d.data() }));
    state.loaded.cols = true;
    fresh.cols = !s.metadata.fromCache;
    settle();
    render();
  }, onErr);
  state.db.collection('cards').onSnapshot((s) => {
    state.cards = s.docs.map((d) => cardNorm({ id: d.id, ...d.data() }));
    state.loaded.cards = true;
    fresh.cards = !s.metadata.fromCache;
    settle();
    render();
  }, onErr);
  state.db.doc('meta/board').onSnapshot((s) => {
    const t = s.exists && s.data().title;
    if (!t) return;
    state.title = t;
    const el = $('#boardTitle');
    if (document.activeElement !== el) el.value = t;
  }, onErr);
}

async function init() {
  prefsLoad();
  applyPrefs();
  calLoad();
  exLoad();
  finRun();
  wireUI();
  wireChat();
  wireQuadro();
  wireSelects();
  setView(viewFromHash());
  setInterval(() => { if (finRun()) render(); alertNotify(); }, 60000);
  setTimeout(() => alertNotify(), 4000);
  if (sbAvailable()) { sbBoot(); return; }
  const [db, user] = await Promise.all([use('db'), use('user')]);
  state.user = user;
  if (user) {
    try { state.canWrite = (await user.can('data.write')) !== false; } catch (e) { /* mantém controles */ }
  }
  if (!state.canWrite) $('#boardTitle').readOnly = true;
  chatStart('', '');
  if (db) { state.db = db; startDb(); } else startLocal();
}
init();

</script>
