function fitTitle() {
  const t = $('#mTitle');
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}

/* openCard(id) abre um cartão; openCard() abre um novo. */
function openCard(id) {
  const isNew = !id;
  const c = isNew ? null : state.cards.find((x) => x.id === id);
  const cols = [...state.cols].sort(byOrder);
  if ((!isNew && !c) || !cols.length) return;
  closeMenus();
  togglePop(false);
  const ro = !state.canWrite;
  state.openId = isNew ? null : id;
  state.isNew = isNew;
  state.sel = isNew ? [] : assigneeKeys(c.assignees);
  state.mLabels = isNew ? [] : labelKeys(c.labels);
  state.mPrio = isNew ? '' : (c.priority || '');
  $('#mHead').textContent = isNew ? 'Novo cartão' : 'Editar cartão';
  $('#mTitle').value = isNew ? '' : c.title;
  $('#mDesc').value = isNew ? '' : (c.desc || '');
  $('#mCol').replaceChildren(...cols.map((col) => h('option', { value: col.id }, col.title)));
  $('#mCol').value = isNew ? (cols.some((x) => x.id === state.lastCol) ? state.lastCol : cols[0].id) : c.col;
  $('#mDue').value = isNew ? '' : (c.due || '');
  ['#mTitle', '#mDesc', '#mCol', '#mDue'].forEach((s) => { $(s).disabled = ro; });
  $('#mSave').hidden = ro;
  $('#mSave').textContent = isNew ? 'Criar cartão' : 'Salvar';
  $('#mDel').hidden = ro || isNew;
  $('#mDel').textContent = 'Excluir';
  $('#mDel').classList.remove('armed');
  renderPrioPick();
  renderLabelPick();
  renderTeamPick();
  $('#scrim').hidden = false;
  document.body.classList.add('modal-open');
  fitTitle();
  if (isNew && !ro) $('#mTitle').focus(); else $('#cardForm').focus();
}

function closeCard() {
  $('#scrim').hidden = true;
  document.body.classList.remove('modal-open');
  state.openId = null;
  state.isNew = false;
}

function saveCard(e) {
  e.preventDefault();
  const title = $('#mTitle').value.trim();
  if (!title) { $('#mTitle').focus(); toast('Dê um título ao cartão.'); return; }
  const now = Date.now();
  let col = $('#mCol').value;
  if (state.isNew) {
    if (!state.cols.some((x) => x.id === col)) col = [...state.cols].sort(byOrder)[0].id;
    const card = {
      id: uid(), col, order: Math.max(0, ...state.cards.filter((x) => x.col === col).map((x) => x.order || 0)) + 1000,
      title, desc: $('#mDesc').value.trim(), priority: state.mPrio, due: $('#mDue').value,
      labels: state.mLabels, assignees: state.sel, created: now, updated: now,
    };
    put('cards', card);
    state.lastCol = col;
    closeCard();
    render();
    const el = document.querySelector('.card[data-id="' + card.id + '"]');
    if (el) { el.classList.add('fresh'); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); toast('Cartão criado'); }
    else toast('Cartão criado. Os filtros estão escondendo ele.');
    return;
  }
  const c = state.cards.find((x) => x.id === state.openId);
  if (!c) { toast('Outra pessoa excluiu este cartão.'); closeCard(); return; }
  if (!state.cols.some((x) => x.id === col)) col = c.col;
  let order = c.order;
  if (col !== c.col) order = Math.max(0, ...state.cards.filter((x) => x.col === col).map((x) => x.order || 0)) + 1000;
  put('cards', {
    ...c, title, col, order, desc: $('#mDesc').value.trim(), priority: state.mPrio,
    due: $('#mDue').value, labels: state.mLabels, assignees: state.sel, updated: now,
  });
  closeCard();
  render();
  toast('Cartão salvo');
}

function deleteCard() {
  const btn = $('#mDel');
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed');
    btn.textContent = 'Confirmar exclusão';
    setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Excluir'; }, 4000);
    return;
  }
  if (state.openId) del('cards', state.openId);
  closeCard();
  render();
  toast('Cartão excluído');
}

/* ---------- Botão + solto: arraste para onde quiser ---------- */
const FAB_KEY = 'quadro-equipe:fab';
const FAB_SIZE = 58;
const FAB_GAP = 16;
const fab = { rx: 1, ry: 1, drag: null, moved: false, inset: { t: 0, r: 0, b: 0, l: 0 } };
const clamp01 = (n) => Math.min(1, Math.max(0, n));

function fabInsets() {
  const p = h('div', { style: 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)' });
  document.body.append(p);
  const s = getComputedStyle(p);
  fab.inset = { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
  p.remove();
}
function fabBox() {
  const x0 = FAB_GAP + fab.inset.l;
  const y0 = FAB_GAP + fab.inset.t;
  return {
    x0, y0,
    x1: Math.max(x0, window.innerWidth - FAB_SIZE - FAB_GAP - fab.inset.r),
    y1: Math.max(y0, window.innerHeight - FAB_SIZE - FAB_GAP - fab.inset.b),
  };
}
function fabPlace() {
  const b = fabBox();
  const el = $('#fab');
  el.style.left = Math.round(b.x0 + fab.rx * (b.x1 - b.x0)) + 'px';
  el.style.top = Math.round(b.y0 + fab.ry * (b.y1 - b.y0)) + 'px';
}
function fabSave() { try { localStorage.setItem(FAB_KEY, JSON.stringify({ rx: fab.rx, ry: fab.ry })); } catch (e) { /* sem armazenamento */ } }
function fabHome() { fab.rx = 1; fab.ry = 1; fabPlace(); fabSave(); }
function fabSet(x, y) {
  const b = fabBox();
  fab.rx = b.x1 > b.x0 ? clamp01((x - b.x0) / (b.x1 - b.x0)) : 1;
  fab.ry = b.y1 > b.y0 ? clamp01((y - b.y0) / (b.y1 - b.y0)) : 1;
  fabPlace();
}

function syncFab() {
  const ok = state.view === 'quadro' && state.canWrite && state.loaded.cols && state.loaded.cards && !state.error && !state.gate && state.cols.length > 0;
  $('#fab').hidden = !ok;
}

function wireFab() {
  const el = $('#fab');
  try {
    const s = JSON.parse(localStorage.getItem(FAB_KEY));
    if (s && Number.isFinite(s.rx) && Number.isFinite(s.ry)) { fab.rx = clamp01(s.rx); fab.ry = clamp01(s.ry); }
  } catch (e) { /* sem armazenamento */ }
  fabInsets();
  fabPlace();
  window.addEventListener('resize', () => { fabInsets(); fabPlace(); });

  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    fab.drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, on: false };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* sem captura */ }
  });
  el.addEventListener('pointermove', (e) => {
    const d = fab.drag;
    if (!d || d.id !== e.pointerId) return;
    if (!d.on) {
      if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
      d.on = true;
      el.classList.add('moving');
    }
    const b = fabBox();
    fabSet(Math.min(b.x1, Math.max(b.x0, e.clientX - d.dx)), Math.min(b.y1, Math.max(b.y0, e.clientY - d.dy)));
  });
  const end = (e) => {
    const d = fab.drag;
    if (!d || d.id !== e.pointerId) return;
    fab.drag = null;
    el.classList.remove('moving');
    if (d.on) { fab.moved = true; setTimeout(() => { fab.moved = false; }, 80); fabSave(); }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', () => { if (!fab.moved) openCard(); });
  el.addEventListener('dragstart', (e) => e.preventDefault());
  el.addEventListener('contextmenu', (e) => { if (fab.drag) e.preventDefault(); });
  /* Pelo teclado: setas movem o botão. */
  el.addEventListener('keydown', (e) => {
    const step = 28;
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    if (!dx && !dy) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    fabSet(r.left + dx, r.top + dy);
    fabSave();
  });
}

/* ---------- Banco online (Supabase) com login ----------
   Só liga quando a página traz window.SB_CFG e a biblioteca do Supabase. */
const SB_TABLE = { cards: 'cartoes', cols: 'colunas' };
const sbOk = (r) => { if (r.error) throw r.error; return r; };
const sbSave = (table, id, data) => state.sb.from(table).upsert({ id, data }).then(sbOk);
const sbRemove = (table, id) => state.sb.from(table).delete().eq('id', id).then(sbOk);
const sbSaveTitle = (title) => state.sb.from('quadro').upsert({ id: 1, data: { title } }).then(sbOk);
const sbAvailable = () => !!(window.SB_CFG && window.supabase && window.supabase.createClient);

const sbTimers = {};
let sbPoll = 0;

function authMsg(text, bad) {
  const m = $('#authMsg');
  m.textContent = text || '';
  m.classList.toggle('bad', !!bad);
}
function showAuth() {
  $('#auth').hidden = false;
  $('#aEmail').focus();
}

async function sbLoad(which) {
  const sb = state.sb;
  try {
    const jobs = [];
    if (!which || which === 'colunas') {
      jobs.push(sb.from('colunas').select('id,data').then(sbOk).then((r) => {
        state.cols = r.data.map((x) => ({ id: x.id, ...x.data }));
        state.loaded.cols = true;
      }));
    }
    if (!which || which === 'cartoes') {
      jobs.push(sb.from('cartoes').select('id,data').then(sbOk).then((r) => {
        state.cards = r.data.map((x) => ({ id: x.id, ...x.data }));
        state.loaded.cards = true;
      }));
    }
    if (!which || which === 'quadro') {
      jobs.push(sb.from('quadro').select('data').eq('id', 1).maybeSingle().then(sbOk).then((r) => {
        const t = r.data && r.data.data && r.data.data.title;
        if (!t) return;
        state.title = t;
        const el = $('#boardTitle');
        if (document.activeElement !== el) el.value = t;
      }));
    }
    await Promise.all(jobs);
    setNotice('');
  } catch (e) {
    setNotice('Sem conexão com o servidor. O quadro pode estar desatualizado e vai tentar de novo.');
  }
  render();
}

function sbSoon(table) {
  clearTimeout(sbTimers[table]);
  sbTimers[table] = setTimeout(() => sbLoad(table), 150);
}
function onVisible() {
  if (!document.hidden && state.sb && !state.gate) sbLoad();
}

function sbStart() {
  sbLoad();
  state.rt = state.sb.channel('quadro-equipe');
  ['cartoes', 'colunas', 'quadro'].forEach((t) => {
    state.rt.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => sbSoon(t));
  });
  state.rt.subscribe();
  sbPoll = setInterval(() => { if (!document.hidden && !state.drag) sbLoad(); }, 45000);
  document.addEventListener('visibilitychange', onVisible);
}

function sbStop() {
  clearInterval(sbPoll);
  document.removeEventListener('visibilitychange', onVisible);
  if (state.rt) { state.sb.removeChannel(state.rt); state.rt = null; }
}

function sbSignedOut() {
  sbStop();
  state.cards = [];
  state.cols = [];
  state.loaded = { cols: false, cards: false };
  state.gate = 'Entre para ver o quadro.';
  $('#logout').hidden = true;
  setNotice('');
  render();
  showAuth();
}

async function sbEnter(session) {
  authMsg('Verificando acesso…');
  const r = await state.sb.rpc('is_member');
  if (r.error) {
    authMsg('Não foi possível verificar o acesso. Tente de novo.', true);
    showAuth();
    return;
  }
  if (r.data !== true) {
    authMsg('Este e-mail não tem acesso ao quadro.', true);
    await state.sb.auth.signOut();
    return;
  }
  const who = await state.sb.rpc('minha_pessoa');
  state.meId = who && !who.error && teamOf(who.data) ? who.data : null;
  authMsg('');
  $('#auth').hidden = true;
  state.gate = '';
  $('#logout').hidden = false;
  $('#logout').title = 'Sair (' + ((session && session.user && session.user.email) || '') + ')';
  sbStart();
}

function wireAuth() {
  $('#authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#aEmail').value.trim();
    const password = $('#aPass').value;
    if (!email || !password) { authMsg('Preencha o e-mail e a senha.', true); return; }
    $('#aSubmit').disabled = true;
    authMsg('Entrando…');
    const r = await state.sb.auth.signInWithPassword({ email, password });
    $('#aSubmit').disabled = false;
    if (r.error || !r.data || !r.data.session) { authMsg('E-mail ou senha incorretos.', true); return; }
    $('#aPass').value = '';
    sbEnter(r.data.session);
  });
  $('#logout').addEventListener('click', () => state.sb.auth.signOut());
}

async function sbBoot() {
  state.sb = window.supabase.createClient(window.SB_CFG.url, window.SB_CFG.key);
  state.mode = 'sb';
  state.gate = 'Entre para ver o quadro.';
  wireAuth();
  render();
  state.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') sbSignedOut(); });
  const { data } = await state.sb.auth.getSession();
  if (data && data.session) sbEnter(data.session); else showAuth();
}

/* ---------- Eventos fixos e arranque ---------- */
function wireUI() {
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  buildFilters();
  syncFilters();
  $('#fBtn').addEventListener('click', () => togglePop());
  document.addEventListener('pointerdown', (e) => { if (!$('#fPop').hidden && !e.target.closest('.fwrap')) togglePop(false); });
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  $('#calBtn').addEventListener('click', calToggle);
  window.addEventListener('hashchange', () => {
    const v = location.hash === '#organograma' ? 'organograma' : 'quadro';
    if (v !== state.view) setView(v);
  });
  window.addEventListener('resize', () => calPlace());

  const bt = $('#boardTitle');
  bt.addEventListener('input', fitBoardTitle);
  bt.addEventListener('change', () => {
    const v = bt.value.trim() || 'Quadro da Equipe';
    bt.value = v;
    saveTitle(v);
  });
  bt.addEventListener('keydown', (e) => { if (e.key === 'Enter') bt.blur(); });

  $('#cardForm').addEventListener('submit', saveCard);
  $('#mTitle').addEventListener('input', fitTitle);
  $('#mTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#cardForm').requestSubmit(); } });
  $('#mClose').addEventListener('click', closeCard);
  $('#mDel').addEventListener('click', deleteCard);
  $('#scrim').addEventListener('mousedown', (e) => { if (e.target === $('#scrim')) closeCard(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (cd && cd.on) { calCancel(); return; }
      if (state.drag) { onCancel(); return; }
      closeMenus();
      togglePop(false);
      if (!$('#setScrim').hidden) { closeSettings(); return; }
      if (!$('#scrim').hidden) { closeCard(); return; }
      if (state.cal.open && !state.cal.docked) calClose();
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if (e.key === 'n' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && $('#scrim').hidden && $('#setScrim').hidden && $('#auth').hidden && !$('#fab').hidden) {
      e.preventDefault();
      openCard();
    }
  });
  wireSettings();
  wireFab();
}

const use = (name) => {
  try { return window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
};

function startLocal() {
  state.mode = 'local';
  const saved = lsLoad();
  if (saved && Array.isArray(saved.cols) && saved.cols.length) {
    state.cols = saved.cols;
    state.cards = saved.cards || [];
    state.title = saved.title || state.title;
  } else {
    state.cols = defaultCols();
    state.cards = welcomeCards(state.cols);
    lsSave();
  }
  state.loaded = { cols: true, cards: true };
  $('#boardTitle').value = state.title;
  setNotice('Esta é uma cópia só sua: as alterações ficam neste navegador e a equipe não vê. Abra o quadro pelo link do artefato, com a sua conta, para trabalharem juntos.');
  render();
}

function startDb() {
  state.mode = 'db';
  const fresh = { cols: false, cards: false };
  const timer = setTimeout(() => {
    if (!(fresh.cols && fresh.cards)) setNotice('Ainda sem resposta do servidor. O quadro continua tentando e pode estar desatualizado.');
  }, 10000);
  const settle = () => { if (fresh.cols && fresh.cards) { clearTimeout(timer); setNotice(''); } };
  const onErr = (e) => {
    state.error = e && e.code === 'revoked' ? 'Seu acesso a este quadro mudou.' : 'Algo impediu o carregamento. Recarregue a página em instantes.';
    render();
  };
  state.db.collection('columns').onSnapshot((s) => {
    state.cols = s.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.loaded.cols = true;
    fresh.cols = !s.metadata.fromCache;
    settle();
    render();
  }, onErr);
  state.db.collection('cards').onSnapshot((s) => {
    state.cards = s.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.loaded.cards = true;
    fresh.cards = !s.metadata.fromCache;
    settle();
    render();
  }, onErr);
  state.db.doc('meta/board').onSnapshot((s) => {
    const t = s.exists && s.data().title;
    if (!t) return;
    state.title = t;
    const el = $('#boardTitle');
    if (document.activeElement !== el) el.value = t;
  }, onErr);
}

async function init() {
  prefsLoad();
  applyPrefs();
  calLoad();
  wireUI();
  setView(location.hash === '#organograma' ? 'organograma' : 'quadro');
  if (sbAvailable()) { sbBoot(); return; }
  const [db, user] = await Promise.all([use('db'), use('user')]);
  state.user = user;
  if (user) {
    try { state.canWrite = (await user.can('data.write')) !== false; } catch (e) { /* mantém controles */ }
  }
  if (!state.canWrite) $('#boardTitle').readOnly = true;
  if (db) { state.db = db; startDb(); } else startLocal();
}
init();

</script>
