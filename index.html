<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quadro da Equipe</title>
<meta name="theme-color" content="#37C9B3">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@500&display=swap">
<style>
/* Água: fundo verde-acinzentado, faixas (colunas) mais escuras, cartões brancos, um único acento aqua. */
:root{
  color-scheme:light;
  --bg:#EDF3F1; --lane:#E1EAE7; --card:#FFFFFF; --fg:#0F2427; --muted:#587074; --faint:#8AA1A4; --line:#D0DDDA;
  --aqua:#37C9B3; --aqua-ink:#05302B;
  --aqua-hi:color-mix(in srgb,var(--aqua) 86%,#000); --accent:color-mix(in srgb,var(--aqua) 58%,#000); --accent-soft:color-mix(in srgb,var(--aqua) 18%,var(--card));
  --ok:#237A4B; --warn:#9A5B00; --bad:#BE3A2E; --ok-soft:#DDF0E5; --warn-soft:#F8E9CC; --bad-soft:#F9E0DC;
  --shadow:rgb(16 60 56); --edge:rgb(16 60 56 / .06); --hover:rgb(16 60 56 / .07); --scrim:rgb(8 28 30 / .5);
  --l-bug:#D2412F; --l-remover:#5E6B73; --l-adicionar:#1E8A55; --l-sugestao:#B57400; --l-design:#7C4DC4; --l-reuniao:#2175C3; --l-marketing:#C93F82;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:12px; --r-lane:18px;
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px)); --gb:max(18px,env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1415; --lane:#101E20; --card:#172A2C; --fg:#E6F1EF; --muted:#8FA9A6; --faint:#5E7A77; --line:#233B3D;
    --aqua:#45D7C0; --aqua-ink:#04231F;
    --aqua-hi:color-mix(in srgb,var(--aqua) 82%,#fff); --accent:color-mix(in srgb,var(--aqua) 76%,#fff); --accent-soft:color-mix(in srgb,var(--aqua) 20%,var(--card));
    --ok:#6CC596; --warn:#E3AE5A; --bad:#F0847C; --ok-soft:#173326; --warn-soft:#3A2D14; --bad-soft:#3E1D1B;
    --shadow:rgb(0 0 0); --edge:rgb(230 241 239 / .08); --hover:rgb(230 241 239 / .08); --scrim:rgb(2 10 11 / .64);
    --l-bug:#FF8A7A; --l-remover:#A9B8BF; --l-adicionar:#62D494; --l-sugestao:#F0B84F; --l-design:#B795F2; --l-reuniao:#6AAEF0; --l-marketing:#F07AAE;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1415; --lane:#101E20; --card:#172A2C; --fg:#E6F1EF; --muted:#8FA9A6; --faint:#5E7A77; --line:#233B3D;
  --aqua:#45D7C0; --aqua-ink:#04231F;
    --aqua-hi:color-mix(in srgb,var(--aqua) 82%,#fff); --accent:color-mix(in srgb,var(--aqua) 76%,#fff); --accent-soft:color-mix(in srgb,var(--aqua) 20%,var(--card));
  --ok:#6CC596; --warn:#E3AE5A; --bad:#F0847C; --ok-soft:#173326; --warn-soft:#3A2D14; --bad-soft:#3E1D1B;
  --shadow:rgb(0 0 0); --edge:rgb(230 241 239 / .08); --hover:rgb(230 241 239 / .08); --scrim:rgb(2 10 11 / .64);
  --l-bug:#FF8A7A; --l-remover:#A9B8BF; --l-adicionar:#62D494; --l-sugestao:#F0B84F; --l-design:#B795F2; --l-reuniao:#6AAEF0; --l-marketing:#F07AAE;
}

/* Paleta derivada do matiz da cor do tema: luminosidade e saturação fixas, só o matiz muda.
   Assim qualquer cor escolhida dá um fundo equilibrado, claro ou escuro. */
@supports (color:oklch(from red l c h)){
  :root{
    --bg:oklch(from var(--aqua) .966 .013 h);
    --lane:oklch(from var(--aqua) .936 .02 h);
    --card:oklch(from var(--aqua) .993 .004 h);
    --line:oklch(from var(--aqua) .89 .025 h);
    --fg:oklch(from var(--aqua) .25 .035 h);
    --muted:oklch(from var(--aqua) .46 .035 h);
    --faint:oklch(from var(--aqua) .66 .03 h);
    --aqua-hi:oklch(from var(--aqua) calc(l - .05) c h);
    --accent:oklch(from var(--aqua) .46 min(c,.13) h);
    --accent-soft:oklch(from var(--aqua) .945 .034 h);
    --shadow:oklch(from var(--aqua) .28 .05 h);
    --edge:color-mix(in srgb,var(--fg) 7%,transparent);
    --hover:color-mix(in srgb,var(--fg) 8%,transparent);
    --scrim:oklch(from var(--aqua) .2 .03 h / .5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:oklch(from var(--aqua) .195 .016 h);
      --lane:oklch(from var(--aqua) .235 .02 h);
      --card:oklch(from var(--aqua) .28 .024 h);
      --line:oklch(from var(--aqua) .365 .03 h);
      --fg:oklch(from var(--aqua) .95 .01 h);
      --muted:oklch(from var(--aqua) .77 .025 h);
      --faint:oklch(from var(--aqua) .6 .025 h);
      --aqua-hi:oklch(from var(--aqua) calc(l + .05) c h);
      --accent:oklch(from var(--aqua) .82 min(c,.14) h);
      --accent-soft:oklch(from var(--aqua) .32 .042 h);
      --shadow:oklch(from var(--aqua) .08 .02 h);
      --edge:color-mix(in srgb,var(--fg) 9%,transparent);
      --hover:color-mix(in srgb,var(--fg) 9%,transparent);
      --scrim:oklch(from var(--aqua) .1 .02 h / .66);
    }
  }
  :root[data-theme="dark"]{
    --bg:oklch(from var(--aqua) .195 .016 h);
    --lane:oklch(from var(--aqua) .235 .02 h);
    --card:oklch(from var(--aqua) .28 .024 h);
    --line:oklch(from var(--aqua) .365 .03 h);
    --fg:oklch(from var(--aqua) .95 .01 h);
    --muted:oklch(from var(--aqua) .77 .025 h);
    --faint:oklch(from var(--aqua) .6 .025 h);
    --aqua-hi:oklch(from var(--aqua) calc(l + .05) c h);
    --accent:oklch(from var(--aqua) .82 min(c,.14) h);
    --accent-soft:oklch(from var(--aqua) .32 .042 h);
    --shadow:oklch(from var(--aqua) .08 .02 h);
    --edge:color-mix(in srgb,var(--fg) 9%,transparent);
    --hover:color-mix(in srgb,var(--fg) 9%,transparent);
    --scrim:oklch(from var(--aqua) .1 .02 h / .66);
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg); color:var(--fg); font:400 calc(14px * var(--fs,1))/1.45 var(--body);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Botões */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:7px; height:38px; padding:0 14px;
  border:0; border-radius:12px; background:var(--card); box-shadow:0 0 0 1px var(--line); font-weight:600; white-space:nowrap;
}
.btn:hover{box-shadow:0 0 0 1.5px var(--accent)}
.btn.sm{height:30px;padding:0 10px;border-radius:9px;font-size:calc(13px * var(--fs,1))}
.btn.big{height:42px;padding:0 20px}
.btn.primary{background:var(--aqua);color:var(--aqua-ink);box-shadow:none}
.btn.primary:hover{background:var(--aqua-hi)}
.btn.quiet{background:transparent;box-shadow:none}
.btn.quiet:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{box-shadow:0 0 0 2px var(--aqua)}
.badge{
  position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; display:grid; place-items:center;
  background:var(--aqua); color:var(--aqua-ink); font-size:calc(11px * var(--fs,1)); font-weight:700; box-shadow:0 0 0 2px var(--bg);
}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;flex:none;border:0;border-radius:11px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.link{border:0;background:transparent;padding:2px 0;color:var(--accent);font-weight:600;text-align:left}
.link:hover{text-decoration:underline}

/* Cabeçalho */
.top{
  flex:none; position:relative; display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px;
  padding:14px var(--gr) 12px var(--gl);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.ttl{display:grid;min-width:0;flex:1}
.title{
  width:auto; max-width:100%; min-width:0; justify-self:start; field-sizing:content; margin:0 0 0 -8px; padding:2px 8px; border:0; border-radius:8px; background:transparent;
  font:700 calc(21px * var(--fs,1))/1.15 var(--display); letter-spacing:-.02em; text-overflow:ellipsis;
}
.title:not([readonly]):hover{background:var(--hover)}
.title:focus{outline:none;background:var(--card);box-shadow:0 0 0 2px var(--aqua)}
.stat{font-size:calc(12.5px * var(--fs,1));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--lane)}
.tab{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px color-mix(in srgb,var(--shadow) 16%,transparent)}
.tools{display:flex;align-items:center;gap:8px;min-width:0}
.tools-board{display:flex;align-items:center;gap:8px;min-width:0}
.search{position:relative;display:flex;align-items:center;min-width:0}
.search .ico{position:absolute;left:11px;width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{
  width:190px; height:38px; padding:0 12px 0 34px; border:0; border-radius:12px; outline:none;
  background:var(--card); box-shadow:0 0 0 1px var(--line);
}
.search input:focus{box-shadow:0 0 0 2px var(--aqua)}
.search input::placeholder{color:var(--faint)}
.prog{display:flex;align-items:center;gap:10px;min-width:0}
.track{flex:0 0 min(190px,36vw);height:7px;border-radius:4px;background:var(--hover);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:4px;background:var(--aqua)}
.prog.full .track i{background:var(--ok)}
.prog b{margin-right:3px;color:var(--fg);font-weight:700}
.notice{flex:none;margin:8px var(--gr) 0 var(--gl);padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:calc(13px * var(--fs,1))}

/* Filtros (popover) */
.fwrap{position:relative}
.pop{
  position:absolute; right:0; top:calc(100% + 8px); z-index:30; width:min(340px,calc(100vw - 24px)); padding:14px; display:grid; gap:14px;
  background:var(--card); border-radius:16px; box-shadow:0 0 0 1px var(--line),0 18px 40px color-mix(in srgb,var(--shadow) 22%,transparent);
}
.fgroup{display:grid;gap:7px}
.flabel{font-size:calc(12px * var(--fs,1));font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fc{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:0;border-radius:999px;background:var(--lane);font-size:calc(13px * var(--fs,1));font-weight:500}
.fc:hover{box-shadow:inset 0 0 0 1.5px var(--aqua)}
.fc[aria-pressed="true"]{background:var(--aqua);color:var(--aqua-ink);font-weight:600}
.fc .av{width:18px;height:18px;font-size:calc(8.5px * var(--fs,1));box-shadow:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dc,var(--faint));flex:none;display:inline-block}

/* Quadro */
.board{
  flex:1; min-height:0; display:flex; align-items:stretch; gap:14px; overflow-x:auto; overflow-y:hidden;
  padding:8px var(--gr) var(--gb) var(--gl); scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
.col{
  flex:0 0 min(var(--colw,304px),86vw); min-width:0; max-height:100%; display:flex; flex-direction:column;
  background:var(--lane); border-radius:var(--r-lane); padding:4px 0;
}
.col-h{position:relative;display:flex;align-items:center;gap:9px;padding:8px 8px 6px 14px}
.col-name{
  flex:1; min-width:0; margin-left:-6px; padding:3px 6px; border:0; border-radius:8px; background:transparent; text-align:left;
  font:600 calc(14.5px * var(--fs,1))/1.25 var(--body); letter-spacing:-.005em; overflow-wrap:anywhere;
}
button.col-name:hover{background:var(--hover)}
input.col-name{background:var(--card);box-shadow:0 0 0 2px var(--aqua);outline:none}
.count{min-width:22px;height:22px;padding:0 7px;border-radius:11px;display:grid;place-items:center;background:var(--hover);color:var(--muted);font-size:calc(12px * var(--fs,1));font-weight:600}
.menu{
  position:absolute; right:6px; top:calc(100% - 2px); z-index:20; min-width:222px; padding:6px; display:grid; gap:1px;
  background:var(--card); border-radius:14px; box-shadow:0 0 0 1px var(--line),0 16px 36px color-mix(in srgb,var(--shadow) 22%,transparent);
}
.menu button{text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;font-weight:500}
.menu button:hover:not(:disabled){background:var(--lane)}
.menu button.danger{color:var(--bad)}
.menu button:disabled{color:var(--faint);cursor:default}
.ghost-col{
  flex:0 0 min(210px,70vw); align-self:flex-start; display:flex; align-items:center; gap:8px; padding:13px 14px;
  border:1.5px dashed var(--line); border-radius:var(--r-lane); background:transparent; color:var(--muted); font-weight:600; text-align:left;
}
.ghost-col:hover{border-color:var(--aqua);color:var(--fg)}
.state{margin:auto;max-width:420px;padding:32px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
.state h2{margin:0;font:700 calc(20px * var(--fs,1)) var(--display);letter-spacing:-.01em}
.state p{margin:0;color:var(--muted);text-wrap:balance}

/* Cartões */
.cards{flex:1;min-height:56px;overflow-y:auto;padding:2px 8px 8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.cards:empty::before{
  content:"Nada por aqui"; display:grid; place-items:center; min-height:56px; border:1.5px dashed var(--line); border-radius:12px;
  color:var(--faint); font-size:calc(13px * var(--fs,1));
}
body.is-dragging .cards:empty::before{content:"Solte aqui";border-color:var(--aqua);color:var(--accent)}
.card{
  display:flex; flex-direction:column; gap:9px; min-width:0; padding:12px 13px; cursor:pointer;
  background:var(--card); border-radius:var(--r-card); box-shadow:0 0 0 1px var(--edge),0 1px 2px color-mix(in srgb,var(--shadow) 8%,transparent);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
.card:hover{box-shadow:0 0 0 1.5px var(--aqua),0 6px 16px color-mix(in srgb,var(--shadow) 12%,transparent)}
.card.dragging{opacity:.35}
.card.fresh{animation:fresh 1.6s ease-out}
.card.ghost{
  position:fixed; left:0; top:0; z-index:45; margin:0; pointer-events:none; opacity:.97; cursor:grabbing;
  box-shadow:0 0 0 1.5px var(--aqua),0 20px 44px color-mix(in srgb,var(--shadow) 34%,transparent);
}
.col.over{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--aqua)}
.drop-line{flex:none;height:3px;margin:-3px 0;border-radius:2px;background:var(--aqua)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.ctitle{display:flex;gap:7px;font-size:calc(14.5px * var(--fs,1));font-weight:500;line-height:1.35}
.ctitle span{min-width:0;overflow-wrap:anywhere}
.ctitle .tt{flex:1}
.ctitle .avs{flex:none;margin-left:auto;align-self:center}
.ctitle .avs .av{width:20px;height:20px;font-size:calc(8.5px * var(--fs,1))}
.ctitle .ico{width:16px;height:16px;margin-top:1px;color:var(--ok);stroke-width:2.4}
.card.done{opacity:.5}
.card.done:hover,.card.done:focus-visible{opacity:.85}
.card.done .ctitle{color:var(--muted)}
.cdone{flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;padding:0;border:2px solid var(--faint);border-radius:50%;background:transparent;color:var(--aqua-ink)}
.cdone:hover:not(:disabled){border-color:var(--aqua)}
.cdone.on{background:var(--aqua);border-color:var(--aqua)}
.ctitle .cdone .ico{width:12px;height:12px;margin:0;color:inherit;stroke-width:3}
.donerow{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.donerow input{width:20px;height:20px;accent-color:var(--aqua)}
.labels{display:flex;gap:5px;flex-wrap:wrap}
.lab{
  padding:1px 8px; border-radius:6px; background:var(--lane); color:var(--fg);
  background:color-mix(in srgb,var(--lc) 15%,var(--card)); color:color-mix(in srgb,var(--lc) 78%,var(--fg));
  font:700 calc(10.5px * var(--fs,1))/1.7 var(--body); letter-spacing:.05em;
}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:calc(12px * var(--fs,1));font-weight:500}
.mt{display:inline-flex;align-items:center;gap:5px}
.mt .ico{width:14px;height:14px}
.mt.p::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.mt.p-alta{color:var(--bad)} .mt.p-media{color:var(--warn)} .mt.p-baixa{color:var(--ok)}
.mt.late{color:var(--bad);font-weight:600}
.avs{margin-left:auto;display:flex}
.avs .av+.av{margin-left:-6px}
.av{
  display:inline-grid; place-items:center; flex:none; width:24px; height:24px; border-radius:50%;
  background:var(--ac); color:#fff; font:700 calc(10px * var(--fs,1))/1 var(--body); letter-spacing:.02em; box-shadow:0 0 0 2px var(--card);
}

/* Botão + solto */
.fab{
  position:fixed; left:0; top:0; z-index:25; width:58px; height:58px; display:grid; place-items:center; border:0; border-radius:50%;
  background:var(--aqua); color:var(--aqua-ink); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  box-shadow:0 10px 24px color-mix(in srgb,var(--shadow) 30%,transparent),0 2px 5px color-mix(in srgb,var(--shadow) 22%,transparent);
}
.fab .ico{width:26px;height:26px;stroke-width:2.4}
.fab:hover{background:var(--aqua-hi)}
.fab:focus-visible{outline-offset:4px}
.fab.moving{cursor:grabbing;transform:scale(1.1);box-shadow:0 0 0 4px color-mix(in srgb,var(--shadow) 12%,transparent),0 18px 38px color-mix(in srgb,var(--shadow) 36%,transparent)}
body.modal-open .fab{visibility:hidden}

/* Espaçamento compacto (configurações) */
:root[data-density="compact"] .card{padding:8px 11px;gap:6px}
:root[data-density="compact"] .cards{gap:5px}
:root[data-density="compact"] .col-h{padding-top:4px;padding-bottom:2px}
:root[data-density="compact"] .crow{padding:6px 10px}

/* Calendário: popup solto ou fixado como coluna */
.calbox{
  position:fixed; z-index:35; width:min(352px,calc(100vw - 16px)); max-height:min(700px,calc(100dvh - 16px)); display:flex; flex-direction:column;
  background:var(--card); border-radius:20px; overflow:hidden; box-shadow:0 0 0 1px var(--line),0 24px 60px color-mix(in srgb,var(--shadow) 30%,transparent);
}
.calbox.moving,.calghost{box-shadow:0 0 0 2px var(--aqua),0 30px 70px color-mix(in srgb,var(--shadow) 40%,transparent)}
.calbox.will-dock,.calghost.will-dock{opacity:.88}
.calghost{position:fixed;left:0;top:0;z-index:45;margin:0;pointer-events:none}
.calcol{flex-basis:min(352px,88vw)}
.col.calcol.dragging{opacity:.35}
.calcol.flash{animation:flash 1.2s ease-out}
.dock-line{flex:none;align-self:stretch;width:4px;margin:0 -5px;border-radius:2px;background:var(--aqua)}
body.is-dragging-cal,body.is-dragging-cal *{cursor:grabbing!important;user-select:none}
.cal-h{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.cal-h .grip{width:16px;height:16px;color:var(--faint);fill:currentColor;stroke:none}
.cal-title{flex:1;font:600 calc(14.5px * var(--fs,1)) var(--body)}
.cal-body{overflow-y:auto;padding:0 14px 14px;display:grid;gap:12px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.calcol .cal-body{flex:1;min-height:0}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-month{flex:1;min-width:0;font:700 calc(17px * var(--fs,1)) var(--display);letter-spacing:-.01em;text-transform:capitalize}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--lane)}
.calcol .seg{background:var(--hover)}
.seg button{height:32px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:calc(13px * var(--fs,1));font-weight:600}
.seg button:hover:not(:disabled){color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px color-mix(in srgb,var(--shadow) 18%,transparent)}
.seg button.s-alta[aria-pressed="true"]{color:var(--bad)}
.seg button.s-media[aria-pressed="true"]{color:var(--warn)}
.seg button.s-baixa[aria-pressed="true"]{color:var(--ok)}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:calc(11.5px * var(--fs,1));font-weight:600;color:var(--faint)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{
  position:relative; aspect-ratio:1/1; max-height:42px; display:grid; place-items:center; padding:0 0 5px; border:0; border-radius:12px;
  background:transparent; font-weight:500;
}
button.cal-day:hover{background:var(--hover)}
.cal-day.blank{visibility:hidden}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--aqua)}
.cal-day.sel{background:var(--aqua);color:var(--aqua-ink);font-weight:700}
.cal-day .dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:2px}
.cal-day .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-day.late .dots i{background:var(--bad)}
.cal-day.done .dots i{background:var(--ok)}
.cal-day.sel .dots i{background:var(--aqua-ink)}
.cal-groups{display:grid;gap:12px}
.cal-group{display:grid;gap:5px}
.cal-gh{padding:2px 2px 0;font-size:calc(12px * var(--fs,1));font-weight:600;color:var(--muted)}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:var(--lane);text-align:left}
.calcol .crow{background:var(--card)}
.crow:hover{box-shadow:0 0 0 1.5px var(--aqua)}
.crow .ct{flex:1;min-width:0}
.crow .t{display:block;font-weight:500;overflow-wrap:anywhere}
.crow .s{display:block;font-size:calc(12px * var(--fs,1));color:var(--muted)}
.crow .s.late{color:var(--bad);font-weight:600}
.crow.done .t{color:var(--muted)}
.cal-empty{margin:0;padding:14px 0;text-align:center;font-size:calc(13px * var(--fs,1));color:var(--faint)}

/* Organograma */
.org{flex:1;min-height:0;overflow:auto;padding:28px var(--gr) 40px var(--gl);display:flex}
.org-chart{
  margin:auto; display:grid; justify-content:center; align-items:start;
  grid-template-columns:minmax(0,320px) 116px minmax(0,320px);
  grid-template-areas:"p1 j p2" "l1 . l2" "a1 . a2";
}
.person{
  display:grid; justify-items:center; gap:12px; padding:24px 20px 18px; border:0; border-radius:22px; background:var(--card); text-align:center;
  box-shadow:0 0 0 1px var(--edge),0 2px 8px color-mix(in srgb,var(--shadow) 8%,transparent);
}
.person:hover{box-shadow:0 0 0 1.5px var(--aqua),0 12px 30px color-mix(in srgb,var(--shadow) 14%,transparent)}
.pav{
  display:grid; place-items:center; width:68px; height:68px; border-radius:50%; background:var(--pc); color:#fff;
  font:700 calc(24px * var(--fs,1)) var(--display); letter-spacing:-.01em;
}
.pname{font:700 calc(21px * var(--fs,1))/1.15 var(--display);letter-spacing:-.015em}
.roles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rp{padding:3px 12px;border-radius:999px;font-size:calc(13px * var(--fs,1));font-weight:700;background:var(--accent-soft);color:var(--accent)}
.rp.ceo{background:var(--aqua);color:var(--aqua-ink)}
.stats{display:flex;gap:18px;justify-content:center;padding-top:12px;margin-top:2px;border-top:1px solid var(--line);width:100%}
.st{display:grid;justify-items:center;font-size:calc(12px * var(--fs,1));color:var(--muted)}
.st b{font:700 calc(20px * var(--fs,1))/1.2 var(--display);color:var(--fg)}
.st.late b{color:var(--bad)}
.go{display:inline-flex;align-items:center;gap:4px;font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--accent)}
.go .ico{width:15px;height:15px}
.vlink{justify-self:center;width:2px;height:28px;background:var(--line)}
.area{width:100%;display:grid;gap:3px;padding:14px 16px;border-radius:16px;background:var(--lane);text-align:center}
.area b{font:600 calc(15px * var(--fs,1)) var(--body)}
.area span{color:var(--muted);font-size:calc(13px * var(--fs,1))}
.cojoin{position:relative;align-self:center;height:2px;background:var(--line)}
.cojoin span{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:3px 11px; border-radius:999px; white-space:nowrap;
  background:var(--bg); box-shadow:0 0 0 1.5px var(--line); font-size:calc(12px * var(--fs,1)); font-weight:600; color:var(--muted);
}

/* Janela do cartão */
.scrim{
  position:fixed; inset:0; z-index:50; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; background:var(--scrim);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.sheet{
  width:min(560px,100%); margin-block:auto; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; padding:20px 20px 18px; min-width:0; box-sizing:border-box;
  background:var(--card); border-radius:22px; box-shadow:0 30px 80px color-mix(in srgb,var(--shadow) 45%,transparent); outline:none;
}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px -6px -8px 0}
.sh-head{font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--muted)}
.m-title{display:block;width:100%;padding:0;border:0;outline:none;resize:none;overflow:hidden;background:transparent;font:700 calc(22px * var(--fs,1))/1.25 var(--display);letter-spacing:-.015em}
.m-title::placeholder{color:var(--faint)}
.m-desc{width:100%;min-height:84px;padding:11px 13px;border:0;border-radius:12px;outline:none;resize:vertical;background:var(--lane);line-height:1.5}
.m-desc:focus,.field:focus,.sel:focus-visible{box-shadow:0 0 0 2px var(--aqua)}
.props{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prop{display:grid;gap:6px;min-width:0}
.prop>label,.plabel{font-size:calc(12px * var(--fs,1));font-weight:600;color:var(--muted)}
.sel,.field{width:100%;min-width:0;height:40px;padding:0 12px;border:0;border-radius:12px;outline:none;background:var(--lane)}
.labpick{display:flex;gap:6px;flex-wrap:wrap}
.lp{
  display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border:0; border-radius:999px; background:var(--lane);
  font:700 calc(11.5px * var(--fs,1)) var(--body); letter-spacing:.05em;
}
.lp::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--lc)}
.lp:hover{box-shadow:inset 0 0 0 1.5px var(--lc)}
.lp[aria-pressed="true"]{background:var(--lane);background:color-mix(in srgb,var(--lc) 18%,var(--card));box-shadow:inset 0 0 0 1.5px var(--lc)}
.tp{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 4px;border:0;border-radius:999px;background:var(--lane);font-weight:600}
.tp .av{box-shadow:none}
.tp:hover{box-shadow:inset 0 0 0 1.5px var(--aqua)}
.tp[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--aqua)}
.tp:disabled,.lp:disabled,.seg button:disabled{cursor:default}
.mf{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* Configurações */
.settings{width:min(500px,100%);gap:14px}
.settings .mf{flex-wrap:wrap}
.seg button{min-width:0;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{display:grid;gap:7px}
.note{margin:-4px 0 0;font-size:calc(12.5px * var(--fs,1));color:var(--faint)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{
  position:relative; width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:50%; cursor:pointer;
  background:var(--sc); color:var(--ink,#fff);
}
.sw .ico{width:16px;height:16px;stroke-width:3;opacity:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--sc,var(--aqua))}
.sw[aria-pressed="true"] .ico{opacity:1}
.sw.custom{background:conic-gradient(#ff6b6b,#ffd166,#6bff9a,#5ec8ff,#a78bfa,#ff7ac8,#ff6b6b)}
.sw.custom[aria-pressed="true"]{background:var(--sc)}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fo{display:grid;gap:1px;padding:8px 12px;border:0;border-radius:12px;background:var(--lane);text-align:left}
.fo b{font:600 calc(20px * var(--fs,1))/1.1 var(--ff)}
.fo span{font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.fo:hover{box-shadow:inset 0 0 0 1.5px var(--aqua)}
.fo[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--aqua)}

/* Entrar */
.scrim.auth{align-items:center;background:var(--bg)}
.authbox{width:min(380px,100%);gap:16px;padding:28px 24px 24px}
.authtitle{margin:0;font:700 calc(24px * var(--fs,1))/1.1 var(--display);letter-spacing:-.02em}
.authmsg{margin:4px 0 0;min-height:1.4em;font-size:calc(13px * var(--fs,1));color:var(--muted)}
.authmsg.bad{color:var(--bad)}
.authbox .field{height:44px}
.authbox label{display:block;margin-bottom:6px;font-size:calc(12px * var(--fs,1));font-weight:600;color:var(--muted)}

.toast{
  position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; max-width:calc(100% - 32px);
  padding:10px 16px; border-radius:999px; background:var(--fg); color:var(--bg); font-size:calc(13px * var(--fs,1)); font-weight:500;
  box-shadow:0 10px 30px color-mix(in srgb,var(--shadow) 30%,transparent);
}

@keyframes fresh{0%,45%{box-shadow:0 0 0 3px var(--aqua),0 8px 22px color-mix(in srgb,var(--shadow) 20%,transparent)}100%{box-shadow:0 0 0 1px var(--edge),0 1px 2px color-mix(in srgb,var(--shadow) 8%,transparent)}}
@keyframes flash{0%,40%{box-shadow:inset 0 0 0 3px var(--aqua)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes drop{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .22s cubic-bezier(.2,.8,.2,1)}
  .calbox{animation:rise .18s cubic-bezier(.2,.8,.2,1)}
  .toast{animation:drop .2s cubic-bezier(.2,.8,.2,1)}
  .track i{transition:width .5s cubic-bezier(.2,.8,.2,1),background-color .3s}
  .card,.btn,.tab,.fc,.crow,.person{transition:box-shadow .12s,background-color .12s,color .12s}
}

/* Telas menores */
@media (max-width:1100px){
  .btn .lbl{display:none}
  .tools .btn{width:38px;padding:0}
}
@media (max-width:760px){
  .top{padding-top:12px;gap:10px}
  .brand{flex:1 1 0}
  .title{font-size:calc(19px * var(--fs,1))}
  .tab{width:38px;padding:0;justify-content:center}
  .tab .lbl{display:none}
  .prog .long{display:none}
  .track{flex-basis:72px}
  .tools{flex:1 1 100%}
  .tools-board{flex:1}
  .search{flex:1}
  .search input{width:100%}
  .fwrap,.awrap{position:static}
  .pop{left:var(--gl);right:var(--gr);top:calc(100% + 4px);width:auto}
  .board{scroll-snap-type:x proximity;scroll-padding-inline:var(--gl)}
  .col{scroll-snap-align:start}
  .scrim:not(.auth){align-items:flex-end;padding:0}
  .scrim:not(.auth) .sheet{width:100%;max-height:94dvh;overflow-y:auto;margin:0;border-radius:22px 22px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .org-chart{grid-template-columns:minmax(0,360px);grid-template-areas:"p1" "l1" "a1" "j" "p2" "l2" "a2"}
  .cojoin{width:2px;height:44px;justify-self:center}
  .fonts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .settings .mf #sDone{flex:1 1 100%}
}

/* ===== Novos recursos: início, empresa, etiquetas, colunas, checklist ===== */
.view{flex:1;min-height:0;overflow:auto;padding:22px var(--gr) 40px var(--gl)}
.view[hidden]{display:none}
.vh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.vh h2{margin:0;flex:1;min-width:200px;font:700 calc(22px * var(--fs,1))/1.2 var(--display);letter-spacing:-.015em;text-transform:capitalize}
.hcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.hcols.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.hcols.one{grid-template-columns:minmax(0,1fr)}
.hcol{display:grid;gap:14px;align-content:start;min-width:0}
.hcol>.w{grid-column:auto}
@media (max-width:900px){.hcols,.hcols.wide{grid-template-columns:minmax(0,1fr)}}
.hgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:stretch;align-content:start}
.w{grid-column:span 6;display:grid;gap:10px;min-width:0;padding:16px;border-radius:var(--r-lane);background:var(--card);box-shadow:0 0 0 1px var(--line)}
.w.s{grid-column:span 4}.w.l{grid-column:span 12}.w.off{opacity:.5}
@media (max-width:900px){.w,.w.s{grid-column:span 12}}
.wh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wh h3{margin:0;flex:1;font:700 calc(15px * var(--fs,1))/1.3 var(--display)}
.wedit{display:flex;gap:4px;align-items:center}
.rowitem{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:0;border-radius:10px;background:var(--lane);text-align:left}
.rowitem:hover{box-shadow:inset 0 0 0 1.5px var(--aqua)}
.rowitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:grid;gap:6px}
.bar{display:block;height:8px;border-radius:99px;background:var(--lane);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--aqua)}
.calnav{display:flex;align-items:center;gap:6px}.calnav b{flex:1;text-transform:capitalize;font-family:var(--display)}
.bigcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bigcal .wd{text-align:center;font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--muted)}
.dc{min-height:72px;display:grid;align-content:start;gap:3px;padding:5px;border-radius:10px;background:var(--lane);overflow:hidden}
.dc.today{box-shadow:inset 0 0 0 2px var(--aqua)}.dc.off{opacity:.45}
.dc .n{font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--muted)}
.dc .more{font-size:11px;color:var(--muted)}
.chip{display:block;width:100%;padding:2px 6px;border:0;border-left:3px solid var(--lc,var(--aqua));border-radius:6px;background:var(--card);text-align:left;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done{text-decoration:line-through;color:var(--faint)}
@media (max-width:600px){.dc{min-height:64px;padding:3px}.chip{font-size:10px;padding:1px 3px}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{padding:10px;border-radius:12px;background:var(--lane);display:grid}
.tile b{font:700 calc(22px * var(--fs,1)) var(--display)}.tile.late b{color:var(--bad)}
.vals{display:flex;gap:6px;flex-wrap:wrap}.vals span{padding:5px 11px;border-radius:999px;background:var(--accent-soft);font-weight:600}
.empty{margin:0;color:var(--muted);font-size:calc(13px * var(--fs,1))}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;border-radius:12px;background:var(--lane)}
.cf{display:grid;gap:8px;min-width:0}.crow .field{background:var(--card)}
.crow .m-desc{background:var(--card);min-height:56px}
.crow input[type=range]{width:100%;accent-color:var(--aqua)}
.cgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.sheet.wide{width:min(640px,100%)}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;border-radius:12px;background:var(--lane)}
.mrow .field{flex:1;min-width:130px;background:var(--card)}
.cpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cp{flex:none;width:22px;height:22px;padding:0;border:0;border-radius:50%}
.cp[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.grip{display:inline-grid;place-items:center;width:26px;height:30px;color:var(--faint);cursor:grab}
.grip .ico{fill:currentColor;stroke:none}
.ckhead{display:flex;align-items:center;gap:10px}.ckhead .bar{flex:1}
.ck{display:flex;align-items:center;gap:8px}
.ck input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--aqua)}
.ck .field{height:34px;background:var(--lane)}
.ck.done .field{text-decoration:line-through;color:var(--faint)}
.mt.ok{color:var(--ok)}
.ico.rot{transform:rotate(90deg)}
.vh h2{text-transform:none}
.sheet.wide{gap:10px}
.bwrap{flex:1;min-height:0;display:flex}
.bwrap>.board{flex:1;min-width:0}
.bside{flex:none;width:214px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;padding:12px 10px var(--gb) var(--gl);border-right:1px solid var(--line)}
.bs-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px 8px}
.bs-h span{font-size:calc(11.5px * var(--fs,1));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bi{position:relative;display:flex;align-items:center;border-radius:10px}
.bi:hover{background:var(--hover)}
.bi[aria-current="true"]{background:var(--accent-soft)}
.bi .bn{flex:1;min-width:0;padding:9px 10px;border:0;border-radius:10px;background:transparent;text-align:left;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi[aria-current="true"] .bn,.bi .bn:hover{color:var(--fg)}
.bi .icon-btn{opacity:0}
.bi:hover .icon-btn,.bi[aria-current="true"] .icon-btn,.bi .icon-btn:focus-visible{opacity:1}
.bi.over{box-shadow:0 -2px 0 var(--aqua)}
.bi .menu{right:0;min-width:200px}
.bi .field{height:34px;margin:2px 4px 2px 0}
.addbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;margin-bottom:14px;border-radius:14px;background:var(--lane)}
@media (max-width:760px){
  .bwrap{flex-direction:column}
  .bside{width:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding:8px var(--gr) 0 var(--gl);border-right:0}
  .bi{flex:none}.bs-h span{display:none}
}
.mcol{display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--lane)}
.mrow1{display:flex;align-items:center;gap:6px}.mrow1 .field{flex:1;min-width:0;background:var(--card)}
.mrow2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.mrow2 label{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.co-hero{grid-column:span 12;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;padding:24px;border-radius:var(--r-lane);background:linear-gradient(135deg,var(--accent-soft),var(--card) 75%);box-shadow:0 0 0 1px var(--line)}
.co-hero h1{margin:4px 0 0;font:700 calc(30px * var(--fs,1))/1.1 var(--display);letter-spacing:-.02em}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:calc(11.5px * var(--fs,1));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.eyebrow .ico{width:15px;height:15px}
.hstats{display:flex;gap:10px;flex-wrap:wrap}.hstats .tile{min-width:96px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.bigta{width:100%;min-height:92px;padding:0;border:0;outline:none;resize:vertical;background:transparent;color:var(--fg);font:500 calc(17px * var(--fs,1))/1.5 var(--display)}
.bigta::placeholder{color:var(--faint)}.bigta:focus{box-shadow:0 2px 0 var(--aqua)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile2{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:14px;border-radius:14px;background:var(--lane);align-items:start}
.tgrid.num .tile2{grid-template-columns:auto minmax(0,1fr)}
.tile2 .x{position:absolute;top:6px;right:6px}
.tile2 .field{background:var(--card);font-weight:600}.tile2 .m-desc{background:var(--card);min-height:56px}
.tile2 .cf>.field:first-child{padding-right:34px}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--aqua);color:var(--aqua-ink);font-weight:700}
.pctbig{font:700 calc(24px * var(--fs,1)) var(--display)}
.w .cojoin span{background:var(--card)}
.org-wrap{overflow-x:auto;padding:6px 0}
/* Janela do cartão: título fixo em cima, botões fixos embaixo, o meio rola */
#cardForm.sheet{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden;max-height:min(920px,calc(100dvh - 32px))}
#cardForm .sh-top{flex:none;margin:0;padding:14px 14px 4px 20px}
#cardForm .mbody{display:grid;gap:18px;flex:1 1 auto;min-height:0;padding:6px 20px 18px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#cardForm .mf{flex:none;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--card)}
@media (max-width:760px){.scrim:not(.auth) #cardForm.sheet{max-height:94dvh;overflow:hidden;padding:0}#cardForm .mf{padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}}
/* Adicionar cartão direto na lista */
.qadd{flex:none;display:block;width:calc(100% - 16px);margin:0 8px 6px;padding:9px 10px;border:0;border-radius:10px;resize:none;overflow:hidden;background:transparent;color:var(--fg);font:inherit;line-height:1.35}
.qadd::placeholder{color:var(--muted);font-weight:500}
.qadd:hover:not(:disabled){background:var(--hover)}
.qadd:focus{background:var(--card);outline:none;box-shadow:0 0 0 2px var(--aqua)}
/* Arrastar quadros e listas */
.bdot{display:inline-block;flex:none;width:9px;height:9px;margin-right:9px;border-radius:50%;background:var(--bc,var(--faint))}
.bi[style*="--bc"][aria-current="true"]{background:color-mix(in srgb,var(--bc) 16%,transparent)}
.bi[aria-current="true"] .bdot{box-shadow:0 0 0 3px color-mix(in srgb,var(--bc,var(--aqua)) 28%,transparent)}
.menu .mcolors{display:grid;gap:7px;padding:6px 10px 8px}
.menu .mcolors .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.menu .cpick .cp{padding:0;border-radius:50%}
.bi.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--aqua)}
.col-h{cursor:grab}.col-h button,.col-h input{cursor:pointer}
.col.dragging-col{opacity:.35}
.ghost-colwin{position:fixed;left:0;top:0;z-index:80;margin:0;pointer-events:none;opacity:.96;box-shadow:0 0 0 1.5px var(--aqua),0 24px 50px color-mix(in srgb,var(--shadow) 34%,transparent)}
.col-line{position:fixed;z-index:70;width:4px;border-radius:2px;background:var(--aqua);pointer-events:none}
.logo{width:40px;height:40px;flex:none;border-radius:11px}
.brandpanel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 20px;border-radius:16px;background:#17624F;color:#fff}
.brandpanel .smark{width:28px;height:46px;flex:none}
.brandpanel .wm{font:500 42px/1 'Outfit',var(--display),sans-serif;letter-spacing:-.01em}
.brandpanel small{flex-basis:100%;color:#8EDBBA;font-size:14px;letter-spacing:.03em}
.awrap{position:relative}.awrap #alertBtn{position:relative}
.badge.late{background:var(--bad);color:#fff}
#alertPop{width:min(380px,calc(100vw - 24px))}
.rsv-big{font:700 calc(26px * var(--fs,1)) var(--display)}
.frow.static{cursor:default}.frow.static:hover{box-shadow:none}
.ftiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.ftiles .tile{padding:14px;background:var(--card);box-shadow:0 0 0 1px var(--line);gap:2px}
.ftiles .tile b{font-size:calc(21px * var(--fs,1));white-space:nowrap}
.tile small{color:var(--muted);font-size:calc(12px * var(--fs,1))}
.tile.pos b{color:var(--ok)}.tile.neg b{color:var(--bad)}
.fgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.fcol{display:grid;gap:14px;align-content:start;min-width:0}
.fgrid .w,.fcol .w{grid-column:auto}
@media (max-width:900px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--lane);cursor:pointer}
.frow:hover{box-shadow:inset 0 0 0 1.5px var(--aqua)}
.frow .fd{flex:1;min-width:0;display:grid}
.frow .fd b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fd small{color:var(--muted)}
.frow .fv{font-weight:700;white-space:nowrap}.frow .fv.in{color:var(--ok)}.frow .fv.out{color:var(--bad)}
.frow.pend .fv{opacity:.6}
.frow .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card);color:var(--muted)}
.frow .tag.late{color:var(--bad)}
.catbar{display:grid;gap:4px}.catbar>div{display:flex;justify-content:space-between;gap:8px;font-size:calc(13px * var(--fs,1))}
.catbar .bar i{background:var(--c,var(--aqua))}
.fbars{display:flex;gap:10px;align-items:flex-end;height:140px}
.fb{flex:1;display:grid;gap:4px;justify-items:center;height:100%;grid-template-rows:1fr auto}
.fb>div{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%}
.fb i{flex:1;min-height:2px;border-radius:4px 4px 0 0}.fb .in{background:var(--ok)}.fb .out{background:var(--bad)}
.fb small{color:var(--muted);font-size:11px;text-transform:capitalize}
.ff{display:grid;gap:6px}.ff2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm{display:grid;gap:14px}.fact{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
</style>

/* Cria elementos sem innerHTML: texto de outras pessoas nunca vira HTML. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function ico(name, cls) {

  s.setAttribute('class', 'ico' + (cls ? ' ' + cls : ''));
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(SVGNS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}

const chains = {};
function onWriteError(e) {
  toast(e && e.code === 'quota_exceeded'
    ? 'O quadro chegou ao limite de itens. Exclua cartões antigos para continuar.'
    : 'Não foi possível salvar essa alteração. Tente de novo.');
}
function enqueue(key, fn) {
  chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(onWriteError);
}
const pathOf = (kind, id) => (kind === 'cards' ? 'cards/' : 'columns/') + id;

function put(kind, obj) {
  const list = state[kind];
  const i = list.findIndex((x) => x.id === obj.id);
  if (i < 0) list.push(obj); else list[i] = obj;
  if (state.mode === 'db') {
    const { id, ...body } = obj;
    const p = pathOf(kind, id);
    enqueue(p, () => state.db.doc(p).set(body));
  } else if (state.mode === 'sb') {
    const { id, ...body } = obj;
    enqueue(kind + '/' + id, () => sbSave(SB_TABLE[kind], id, body));
  } else lsSave();
}
function del(kind, id) {
  state[kind] = state[kind].filter((x) => x.id !== id);
  if (state.mode === 'db') {
    const p = pathOf(kind, id);
    enqueue(p, () => state.db.doc(p).delete());
  } else if (state.mode === 'sb') {
    enqueue(kind + '/' + id, () => sbRemove(SB_TABLE[kind], id));
  } else lsSave();
}

function renameCol(col, btn) {

function moveCol(col, dir) {

/* ---------- Calendário de tarefas ----------
   Aparece como janela solta (arraste pelo topo) ou fixado no quadro como se fosse uma coluna.
   Arrastar a janela sobre o quadro fixa; arrastar a coluna para fora solta de novo. */
const CAL_KEY = 'quadro-equipe:cal';
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const WD = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

function calLoad() {
  const t = new Date();
  state.cal.ym = { y: t.getFullYear(), m: t.getMonth() };
  try {
    const s = JSON.parse(localStorage.getItem(CAL_KEY));
    if (!s) return;
    state.cal.docked = !!s.docked;
    state.cal.before = typeof s.before === 'string' ? s.before : '';
    state.cal.x = Number.isFinite(s.x) ? s.x : null;
    state.cal.y = Number.isFinite(s.y) ? s.y : null;
    if (['all', 'me', 'other', 'luis', 'lais'].includes(s.who)) state.cal.who = s.who;
  } catch (e) { /* sem armazenamento */ }
}
function calSave() {
  const { docked, before, x, y, who } = state.cal;
  try { localStorage.setItem(CAL_KEY, JSON.stringify({ docked, before, x, y, who })); } catch (e) { /* sem armazenamento */ }
}

/* Quem aparece no seletor: "Minhas" só existe quando sabemos quem entrou. */
const calMe = () => (state.meId && teamOf(state.meId) ? state.meId : null);
function calPeople() {
  const me = calMe();
  if (me) {
    const other = TEAM.find((m) => m.id !== me);
    return [['all', 'Todas'], ['me', 'Minhas'], ['other', other ? other.name : 'Outra pessoa']];
  }
  return [['all', 'Todas'], ...TEAM.map((m) => [m.id, m.name])];
}
function calWho() {
  const w = state.cal.who;
  return calPeople().some(([k]) => k === w) ? w : 'all';
}
function calWhoId() {
  const w = calWho();
  const me = calMe();
  if (w === 'me') return me;
  if (w === 'other') { const o = TEAM.find((m) => m.id !== me); return o ? o.id : null; }
  return teamOf(w) ? w : null;
}

const sortCards = (arr) => {
  const co = {};
  state.cols.forEach((c) => { co[c.id] = c.order || 0; });
  return [...arr].sort((a, b) => (co[a.col] || 0) - (co[b.col] || 0) || byOrder(a, b));
};
function dayLabel(ds) {
  const t = new Date(ds + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
  return (ds === todayStr() ? 'Hoje, ' : '') + t;
}

function calRow(c) {
  const col = state.cols.find((x) => x.id === c.col);

function calList(byDay, tasks, y, m) {
  const groups = [];
  if (state.cal.day) {
    groups.push([dayLabel(state.cal.day), sortCards(byDay[state.cal.day] || [])]);
  } else {
    const prefix = y + '-' + pad2(m + 1) + '-';
    Object.keys(byDay).filter((k) => k.startsWith(prefix)).sort().forEach((k) => groups.push([dayLabel(k), sortCards(byDay[k])]));
    const nodue = sortCards(tasks.filter((c) => !c.due && !isDone(c)));
    if (nodue.length) groups.push(['Sem prazo', nodue]);
  }
  if (!groups.some((g) => g[1].length)) {
    return h('p', { class: 'cal-empty' }, state.cal.day ? 'Nada marcado para este dia.' : 'Nenhuma tarefa neste mês.');
  }
  return h('div', { class: 'cal-groups' }, groups.filter((g) => g[1].length).map(([label, items]) =>
    h('div', { class: 'cal-group' }, h('div', { class: 'cal-gh' }, label), items.map(calRow))));
}

function calInner(docked) {
  const { y, m } = state.cal.ym;
  const id = calWhoId();

  const today = todayStr();
  const week = state.prefs ? state.prefs.week : 0;
  const lead = (new Date(y, m, 1).getDay() - week + 7) % 7;

  const cells = [];

  for (let d = 1; d <= total; d++) {
    const ds = dstr(y, m, d);
    const list = byDay[ds] || [];
    const late = list.some((c) => !isDone(c) && ds < today);
    const allDone = list.length > 0 && list.every(isDone);
    const sel = state.cal.day === ds;
    cells.push(h('button', {
      type: 'button', 'aria-pressed': sel ? 'true' : 'false',
      class: 'cal-day' + (ds === today ? ' today' : '') + (sel ? ' sel' : '') + (late ? ' late' : '') + (allDone ? ' done' : ''),
      'aria-label': d + ' de ' + MESES[m] + (list.length ? ', ' + list.length + (list.length === 1 ? ' tarefa' : ' tarefas') : ''),
      onclick: () => { state.cal.day = sel ? '' : ds; calRefresh(); },
    }, String(d), list.length > 0 && h('span', { class: 'dots' }, list.slice(0, 3).map(() => h('i')))));
  }
  const wd = [...WD.slice(week), ...WD.slice(0, week)];
  const pinned = docked;
  const head = h('div', { class: 'cal-h', onpointerdown: (e) => calGripDown(e, docked) },
    ico('grip', 'grip'),

function calGo(delta) {

function calRefresh() { if (state.cal.docked) render(); else calRenderFloat(); }

function calPlace() {
  const el = $('#calFloat');
  if (el.hidden) return;
  const w = el.offsetWidth;
  const hh = el.offsetHeight;
  let { x, y } = state.cal;
  if (x == null || y == null) {
    x = window.innerWidth - w - 16;
    y = $('.top').getBoundingClientRect().bottom + 8;
  }
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  y = Math.max(8, Math.min(y, window.innerHeight - Math.min(hh, 96) - 8));
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

function calRenderFloat() {
  const el = $('#calFloat');
  const show = state.cal.open && !state.cal.docked;
  $('#calBtn').setAttribute('aria-pressed', (show || state.cal.docked) ? 'true' : 'false');
  if (cd && cd.on && !cd.docked) return;
  el.hidden = !show;
  if (!show) return;
  const sc = el.querySelector('[data-scroll]');
  const top = sc ? sc.scrollTop : 0;
  el.replaceChildren(...calInner(false));
  const nb = el.querySelector('[data-scroll]');

function calTogglePin() {

function calFocusDocked() {

/* ---- Arrastar o calendário (solto ou fixado) ---- */
let cd = null;
const calBlock = (e) => { if (cd && cd.on && e.cancelable) e.preventDefault(); };

function calGripDown(e, docked) {
  if (e.target.closest('button') || state.drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const panel = docked ? e.currentTarget.closest('.calcol') : $('#calFloat');
  const r = panel.getBoundingClientRect();
  cd = { docked, panel, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, w: r.width, h: r.height, on: false, el: null, over: false, before: '' };
  document.addEventListener('pointermove', calMove);
  document.addEventListener('pointerup', calUp);
  document.addEventListener('pointercancel', calCancel);
  document.addEventListener('touchmove', calBlock, { passive: false });
}

function calMove(e) {
  if (!cd) return;
  if (!cd.on) {
    if (Math.hypot(e.clientX - cd.sx, e.clientY - cd.sy) < 5) return;
    cd.on = true;
    cd.panel = cd.docked ? document.querySelector('.calcol') || cd.panel : $('#calFloat');
    state.drag = { cal: true };
    document.body.classList.add('is-dragging-cal');
    if (cd.docked) {
      const g = cd.panel.cloneNode(true);
      g.classList.add('calghost');
      g.style.width = cd.w + 'px';
      g.style.height = cd.h + 'px';
      document.body.append(g);
      cd.el = g;
      cd.panel.classList.add('dragging');
    } else {
      cd.el = cd.panel;
      cd.panel.classList.add('moving');
    }
    calAutoScroll();
  }
  let x = e.clientX - cd.dx;
  let y = e.clientY - cd.dy;
  if (!cd.docked) {
    x = Math.max(8, Math.min(x, window.innerWidth - cd.w - 8));
    y = Math.max(8, Math.min(y, window.innerHeight - 96));
  }
  cd.el.style.left = x + 'px';
  cd.el.style.top = y + 'px';
  cd.lx = e.clientX;
  cd.ly = e.clientY;
  calZone();
}

/* Onde o calendário cairia: sobre o quadro ele encaixa entre as colunas; fora, fica solto. */
function calZone() {
  const b = $('#board').getBoundingClientRect();
  cd.over = state.view === 'quadro' && !$('#board').hidden && cd.ly > b.top - 6 && cd.ly < b.bottom + 6 && cd.lx >= b.left && cd.lx <= b.right;
  cd.el.classList.toggle('will-dock', cd.over);
  document.querySelectorAll('.dock-line').forEach((l) => l.remove());
  if (!cd.over) return;
  const cols = [...document.querySelectorAll('#board .col:not(.calcol)')];
  const next = cols.find((c) => { const r = c.getBoundingClientRect(); return cd.lx < r.left + r.width / 2; });
  cd.before = next ? next.dataset.col : '';
  const line = h('div', { class: 'dock-line' });
  if (next) next.before(line);
  else { const gc = $('#board .ghost-col'); if (gc) gc.before(line); else $('#board').append(line); }
}

/* Rola o quadro quando o calendário chega perto das bordas. */
function calAutoScroll() {
  const tick = () => {
    if (!cd || !cd.on) return;
    const board = $('#board');
    const b = board.getBoundingClientRect();
    let dx = 0;
    if (cd.over || cd.ly > b.top - 40) { if (cd.lx < b.left + 56) dx = -16; else if (cd.lx > b.right - 56) dx = 16; }
    if (dx && !board.hidden) { board.scrollLeft += dx; calZone(); }
    cd.raf = requestAnimationFrame(tick);
  };
  cd.raf = requestAnimationFrame(tick);
}

function calClean() {
  document.removeEventListener('pointermove', calMove);
  document.removeEventListener('pointerup', calUp);
  document.removeEventListener('pointercancel', calCancel);
  document.removeEventListener('touchmove', calBlock);
  if (cd) {
    cancelAnimationFrame(cd.raf);
    if (cd.docked && cd.el) cd.el.remove();
    if (cd.panel) cd.panel.classList.remove('dragging', 'moving', 'will-dock');
    if (cd.el) cd.el.classList.remove('will-dock');
    if (cd.on) state.drag = null;
  }
  document.querySelectorAll('.dock-line').forEach((l) => l.remove());
  document.body.classList.remove('is-dragging-cal');
  cd = null;
}

function calUp() {
  const c = cd;
  if (!c) return;
  if (!c.on) { calClean(); return; }
  const over = c.over;
  const before = c.before;
  const left = parseFloat(c.el.style.left);
  const top = parseFloat(c.el.style.top);
  calClean();
  if (over) { state.cal.docked = true; state.cal.open = false; state.cal.before = before; }
  else { state.cal.docked = false; state.cal.open = true; state.cal.x = left; state.cal.y = top; }
  calSave();
  state.pending = false;
  render();
}

function calCancel() {
  const was = cd && cd.on;
  calClean();
  if (was) { state.pending = false; render(); }
}

/* ---------- Organograma ----------
   Laís e Luís lideram juntos (co-CEOs); cada um acumula uma área. Os números vêm das tarefas do quadro. */
function orgStats(id) {
  const mine = state.cards.filter((c) => assigneeKeys(c.assignees).includes(id));
  const open = mine.filter((c) => !isDone(c));
  const late = open.filter((c) => c.due && c.due < todayStr());
  return { open: open.length, late: late.length, done: mine.length - open.length };
}

const FONTS = [

];

function loadFonts(list) {
  const qs = list.filter((f) => f.q && !fontsLoaded.has(f.id));

  qs.forEach((f) => fontsLoaded.add(f.id));

function prefsLoad() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { /* sem armazenamento */ }
  state.prefs = { ...PREF_DEFAULT, ...p };
  if (!['auto', 'light', 'dark'].includes(state.prefs.theme)) state.prefs.theme = 'auto';
  if (!/^#[0-9a-f]{6}$/i.test(state.prefs.color)) state.prefs.color = '';
  if (!FONTS.some((f) => f.id === state.prefs.font)) state.prefs.font = 'padrao';
  if (!SIZES[state.prefs.size]) state.prefs.size = 'm';
  if (!['cozy', 'compact'].includes(state.prefs.dens)) state.prefs.dens = 'cozy';
  if (!WIDES[state.prefs.wide]) state.prefs.wide = 'm';
  state.prefs.week = state.prefs.week === 1 ? 1 : 0;
}
function prefsSave() { try { localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs)); } catch (e) { /* sem armazenamento */ } }

/* Texto sobre a cor de destaque: escuro em cores claras, branco em cores escuras. */
function inkFor(hex) {
  const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  const lum = 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  /* escolhe a tinta (escura ou branca) com mais contraste real sobre a cor */
  return (lum + 0.05) / 0.062 >= 1.05 / (lum + 0.05) ? '#08201C' : '#FFFFFF';
}

function applyPrefs() {
  const p = state.prefs;
  const root = document.documentElement;
  if (p.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', p.theme);
  if (p.color) { root.style.setProperty('--aqua', p.color); root.style.setProperty('--aqua-ink', inkFor(p.color)); }
  else { root.style.removeProperty('--aqua'); root.style.removeProperty('--aqua-ink'); }
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', p.color || '#37C9B3');
  const f = FONTS.find((x) => x.id === p.font) || FONTS[0];
  if (f.id === 'padrao') { root.style.removeProperty('--body'); root.style.removeProperty('--display'); }
  else { root.style.setProperty('--body', fontStack(f, 'body')); root.style.setProperty('--display', fontStack(f, 'disp')); loadFonts([f]); }
  root.style.setProperty('--fs', String(SIZES[p.size]));
  root.style.setProperty('--colw', WIDES[p.wide] + 'px');
  root.dataset.density = p.dens;
}

function setPref(k, v) {
  state.prefs[k] = v;
  prefsSave();
  applyPrefs();
  renderSettings();
  if (k === 'week') calRefresh();
  if (k === 'size' || k === 'font') requestAnimationFrame(calPlace);
}

function renderChrome() {

    ? [h('b', null, pct + '%'), ' ' + d + ' de ' + n, h('span', { class: 'long' }, n === 1 ? ' concluído' : ' concluídos')]
    : ['Sem cartões ainda']));

/* largura do campo do título acompanha o texto (o campo não estica pela barra toda) */
function fitBoardTitle() {
  const t = $('#boardTitle');
  t.size = Math.max(8, Math.min(60, t.value.length + 2));
}

function render() {
  if (state.drag || cdrag) { state.pending = true; return; }
  const ae = document.activeElement;
  if ((state.view === 'empresa' || state.view === 'financas') && ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.closest('#company, #finance')) { state.typing = true; return; }
  if (state.renaming && document.querySelector('input.col-name, #boards .bi .field')) return;
  renderAlertBadge();
  ensureBoards();
  renderChrome();
  renderBoards();
  calRenderFloat();
  if (state.view === 'inicio') { renderHome(); return; }
  if (state.view === 'empresa') { renderCompany(); return; }
  if (state.view === 'financas') { renderFinance(); return; }

  const board = $('#board');
  const sl = board.scrollLeft;
  const st = {};
  board.querySelectorAll('.cards,.cal-body').forEach((e) => { st[e.dataset.col || 'cal'] = e.scrollTop; });

  const ready = state.loaded.cols && state.loaded.cards;
  const cols = bCols().sort(byOrder);
  let nodes;
  if (state.error) {
    nodes = [h('div', { class: 'state' }, h('h2', null, 'Não deu para abrir o quadro'), h('p', null, state.error))];
  } else if (state.gate) {
    nodes = [h('div', { class: 'state' }, h('h2', null, state.gate))];
  } else if (!ready) {
    nodes = [h('div', { class: 'state' }, h('h2', null, 'Carregando o quadro'), h('p', null, 'Buscando as colunas e os cartões da equipe.'))];
  } else if (!cols.length) {
    nodes = [h('div', { class: 'state' },
      h('h2', null, 'O quadro está vazio'),
      h('p', null, state.canWrite ? 'Crie as colunas padrão para começar. Depois você renomeia, move ou exclui cada uma.' : 'Ainda não há colunas neste quadro.'),
      state.canWrite && h('button', { class: 'btn primary', type: 'button', onclick: seedColumns }, 'Criar colunas padrão'))];
  } else {
    nodes = cols.map(colEl);
    if (state.cal.docked) {
      const el = calColEl();
      const i = state.cal.before ? nodes.findIndex((n) => n.dataset.col === state.cal.before) : -1;
      if (i >= 0) nodes.splice(i, 0, el); else nodes.push(el);
    }
    if (state.canWrite) nodes.push(h('button', { class: 'ghost-col', type: 'button', onclick: newColumn }, ico('plus'), 'Nova coluna'));
  }

/* ---------- Arrastar e soltar (mouse e toque) ----------
   Pegou o cartão, soltou em qualquer ponto da coluna: ele fica ali.
   No celular, segure o cartão por um instante para arrastar. */
let press = null;
let dragMoved = false;
let ghost = null;
let scrollRaf = 0;
const last = { x: 0, y: 0 };

function removeLine() { document.querySelectorAll('.drop-line').forEach((x) => x.remove()); }

function neighbor(el, dir) {
  let n = dir < 0 ? el.previousElementSibling : el.nextElementSibling;
  while (n && !(n.classList.contains('card') && !n.classList.contains('dragging'))) {
    n = dir < 0 ? n.previousElementSibling : n.nextElementSibling;
  }
  return n;
}

function renormalize(colId) {
  state.cards.filter((c) => c.col === colId).sort(byOrder).forEach((c, i) => {
    if (c.order !== (i + 1) * 1000) put('cards', { ...c, order: (i + 1) * 1000 });
  });
}

function moveCard(id, colId, prevEl, nextEl) {
  const c = state.cards.find((x) => x.id === id);
  if (!c) return;
  const get = (el) => (el ? state.cards.find((x) => x.id === el.dataset.id) : null);
  const p = get(prevEl);
  const n = get(nextEl);
  let o;
  if (p && n) o = (p.order + n.order) / 2;
  else if (p) o = p.order + 1000;
  else if (n) o = n.order - 1000;
  else o = Math.max(0, ...state.cards.filter((x) => x.col === colId && x.id !== id).map((x) => x.order || 0)) + 1000;
  /* Coluna marcada como de concluídos: entrar nela conclui o cartão e sair dela reabre. */
  const from = state.cols.find((x) => x.id === c.col), to = state.cols.find((x) => x.id === colId);
  const flip = from && to && from.id !== to.id && !!from.done !== !!to.done;
  put('cards', { ...c, col: colId, order: o, ...(flip ? { done: !!to.done } : {}), updated: Date.now() });
  if (p && n && Math.abs(n.order - p.order) < 1e-6) renormalize(colId);
}

/* A coluna alvo é a que está sob o dedo; em qualquer outro ponto da tela, a mais próxima na horizontal.
   Soltar nunca "volta" o cartão: para desistir, aperte Esc. */
function colAt(x, y) {
  const cols = [...document.querySelectorAll('#board .col:not(.calcol)')];
  let best = null;
  let bestD = Infinity;
  for (const c of cols) {
    const r = c.getBoundingClientRect();
    const d = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function placeLine(col) {
  removeLine();
  const body = col.querySelector('.cards');
  if (!body) return;
  const line = h('div', { class: 'drop-line' });
  const cards = [...body.querySelectorAll('.card:not(.dragging)')];
  const next = cards.find((c) => { const r = c.getBoundingClientRect(); return last.y < r.top + r.height / 2; });
  if (next) body.insertBefore(line, next); else body.append(line);
}

function update() {
  if (!state.drag || !ghost) return;
  ghost.style.transform = 'translate(' + (last.x - state.drag.dx) + 'px,' + (last.y - state.drag.dy) + 'px) rotate(2deg)';
  const hit = document.elementFromPoint(last.x, last.y), bi = hit && hit.closest ? hit.closest('.bi[data-board]') : null;
  document.querySelectorAll('.bi.drop').forEach((x) => { if (x !== bi) x.classList.remove('drop'); });
  if (bi && bi.dataset.board !== ex.board) {
    bi.classList.add('drop');
    state.dragBoard = bi.dataset.board;
    document.querySelectorAll('.col.over').forEach((c) => c.classList.remove('over'));
    removeLine();
    return;
  }
  state.dragBoard = null;
  const col = colAt(last.x, last.y);
  document.querySelectorAll('.col.over').forEach((c) => { if (c !== col) c.classList.remove('over'); });
  if (!col) { removeLine(); return; }
  col.classList.add('over');
  placeLine(col);
}

/* Rola o quadro quando o cartão chega perto das bordas. */
function autoScroll() {
  const tick = () => {
    if (!state.drag) return;
    const board = $('#board');
    const br = board.getBoundingClientRect();
    let dx = 0;
    if (last.x < br.left + 56) dx = -16; else if (last.x > br.right - 56) dx = 16;
    if (dx) { board.scrollLeft += dx; update(); }
    const body = document.querySelector('.col.over .cards');
    if (body) {
      const r = body.getBoundingClientRect();
      let dy = 0;
      if (last.y < r.top + 36) dy = -12; else if (last.y > r.bottom - 36) dy = 12;
      if (dy) { body.scrollTop += dy; update(); }
    }
    scrollRaf = requestAnimationFrame(tick);

const blockScroll = (e) => { if (state.drag && e.cancelable) e.preventDefault(); };

function unlisten() {
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup', onUp);
  document.removeEventListener('pointercancel', onCancel);
  document.removeEventListener('touchmove', blockScroll);
}

function cancelPress() {
  if (press) clearTimeout(press.timer);
  press = null;
  unlisten();
}

function startPress(e, el, c) {
  if (!state.canWrite || state.drag || cdrag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  press = { id: c.id, el, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', timer: 0 };
  last.x = e.clientX;
  last.y = e.clientY;
  if (press.touch) press.timer = setTimeout(beginDrag, 260);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
  document.addEventListener('touchmove', blockScroll, { passive: false });

function beginDrag() {
  if (!press) return;
  clearTimeout(press.timer);
  const el = press.el;
  const r = el.getBoundingClientRect();
  state.drag = { id: press.id, dx: press.x - r.left, dy: press.y - r.top };
  dragMoved = true;
  ghost = el.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.removeAttribute('data-id');
  ghost.removeAttribute('tabindex');
  ghost.style.width = r.width + 'px';
  document.body.append(ghost);
  el.classList.add('dragging');
  document.body.classList.add('is-dragging');

function onMove(e) {

  last.y = e.clientY;

function endDrag() {

  removeLine();

  document.querySelectorAll('.col.over').forEach((x) => x.classList.remove('over'));
  document.querySelectorAll('.bi.drop').forEach((x) => x.classList.remove('drop'));
  document.body.classList.remove('is-dragging');
  state.drag = null;
  state.dragBoard = null;
  state.pending = false;

function onUp() {

  const col = colAt(last.x, last.y);
  let colId = null;
  let prev = null;
  let next = null;
  if (col) {
    colId = col.dataset.col;
    const line = col.querySelector('.drop-line');
    if (line) { prev = neighbor(line, -1); next = neighbor(line, 1); }
  }
  endDrag();
  if (toBoard) { moveToBoard(id, toBoard); render(); return; }
  if (colId) {
    const before = state.cards.find((x) => x.id === id);
    moveCard(id, colId, prev, next);
    if (before && before.col !== colId) {
      const dest = state.cols.find((x) => x.id === colId);
      if (dest) toast('Movido para ' + dest.title);

  render();

      const has = f.desc || f.checklist.length || f.labels.length || f.assignees.length || f.priority || f.due || f.done;
      if (!auto || !has) return null;
      title = 'Novo cartão';

    const card = { id: uid(), col, order: Math.max(0, ...state.cards.filter((x) => x.col === col).map((x) => x.order || 0)) + 1000, title, ...f, created: now, updated: now };

    let [y, m] = r.start.split('-').map(Number);
    for (let g = 0; g < 600; g++) {

/* ---------- Botão + solto: arraste para onde quiser ---------- */
const FAB_KEY = 'quadro-equipe:fab';
const FAB_SIZE = 58;
const FAB_GAP = 16;
const fab = { rx: 1, ry: 1, drag: null, moved: false, inset: { t: 0, r: 0, b: 0, l: 0 } };
const clamp01 = (n) => Math.min(1, Math.max(0, n));

function fabInsets() {

    x1: Math.max(x0, window.innerWidth - FAB_SIZE - FAB_GAP - fab.inset.r),
    y1: Math.max(y0, window.innerHeight - FAB_SIZE - FAB_GAP - fab.inset.b),

}
function fabPlace() {
  const b = fabBox();
  const el = $('#fab');
  el.style.left = Math.round(b.x0 + fab.rx * (b.x1 - b.x0)) + 'px';
  el.style.top = Math.round(b.y0 + fab.ry * (b.y1 - b.y0)) + 'px';
}

  const b = fabBox();
  fab.rx = b.x1 > b.x0 ? clamp01((x - b.x0) / (b.x1 - b.x0)) : 1;
  fab.ry = b.y1 > b.y0 ? clamp01((y - b.y0) / (b.y1 - b.y0)) : 1;
  fabPlace();
}

function syncFab() {
  const ok = state.view === 'quadro' && state.canWrite && state.loaded.cols && state.loaded.cards && !state.error && !state.gate && bCols().length > 0;
  $('#fab').hidden = !ok;
}

function wireFab() {
  const el = $('#fab');
  try {
    const s = JSON.parse(localStorage.getItem(FAB_KEY));
    if (s && Number.isFinite(s.rx) && Number.isFinite(s.ry)) { fab.rx = clamp01(s.rx); fab.ry = clamp01(s.ry); }
  } catch (e) { /* sem armazenamento */ }
  fabInsets();
  fabPlace();
  window.addEventListener('resize', () => { fabInsets(); fabPlace(); });

  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    fab.drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, on: false };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* sem captura */ }
  });
  el.addEventListener('pointermove', (e) => {
    const d = fab.drag;
    if (!d || d.id !== e.pointerId) return;
    if (!d.on) {
      if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
      d.on = true;
      el.classList.add('moving');
    }
    const b = fabBox();
    fabSet(Math.min(b.x1, Math.max(b.x0, e.clientX - d.dx)), Math.min(b.y1, Math.max(b.y0, e.clientY - d.dy)));
  });
